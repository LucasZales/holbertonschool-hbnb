<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/icon.png">
</head>
<body>
    <header>
    <img src="images/logo.png" alt="HBnB Logo" class="logo">

    <a href="login.html" class="login-button">Login</a>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
    <main>

    <section id="place-details" class="place-details">
        <div class="place-info">
            <h1>House 1</h1>
            <p>Host: John</p>
            <p>Price: $100</p>
            <p>Description: Nice house.</p>
            <p>Amenities: WiFi, Kitchen</p>
        </div>
    </section>


    <section id="reviews">
        <h2>Reviews</h2>

        <article class="review-card">
            <p>User: Lucas</p>
            <p>Rating: 5</p>
            <p>Comment: Great place!</p>
        </article>

    </section>


    <section id="add-review" class="add-review">
        <h2>Add a Review</h2>

        <form class="form" id="review-form">

            <label for="review-text">Review:</label>

            <textarea 
                id="review-text" 
                name="review-text" 
                required>
            </textarea>

            <button type="submit">Submit</button>

        </form>
    </section>

    </main>
    <footer>
    <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
